version: "3"

tasks:
  default:
    desc: "Command list"
    cmds:
      - task --list --color
  test:
    desc: "Run all tests"
    cmds:
      - go test -race -v -coverprofile=coverage.out ./internal/...
  test:cover:
    desc: "Run all tests with visual coverage out"
    deps: [ test ]
    cmds:
      - go tool cover -html=coverage.out -o coverage.html
  test:reauth:
    desc: "Test re‑auth based on the extracted data. env TELEGRAM_AUTH_KEY is required"
    dotenv: [".env"]
    cmds:
      - go test -tags=integration -count=1 -v -run TestVerifier_ReauthWithExtractedKey ./internal/infra/telegram/
  test:integration:
    desc: "Storage integration tests against a throwaway Postgres (needs Docker)"
    cmds:
      - go test -tags=integration -count=1 -v ./internal/infra/storage/
  generate:api:
    desc: "Generate openapi code"
    cmds:
      - go generate ./gen/...
  lint:
    desc: "Run linter"
    cmds:
      - golangci-lint run ./...
  ci:
    desc: "Reproduce the GitHub Actions CI locally"
    cmds:
      - go generate ./...
      - go build ./...
      - go vet ./...
      - go test -race -count=1 ./...
      - golangci-lint run ./...
      - go test -tags=integration -count=1 ./internal/infra/storage/...
  run:
    desc: "Run the service and Prometheus locally"
    deps: [run:app, run:prometheus]
  run:app:
    desc: "Run only the service locally"
    env:
      CONFIG_PATH: ./config/local.yaml
    cmds:
      - go build -o .local/extractor ./cmd/telegram-auth-extractor
      - ./.local/extractor
  run:prometheus:
    internal: true
    preconditions:
      - sh: command -v prometheus
        msg: "Install Prometheus and add it to PATH (macOS: brew install prometheus)."
    cmds:
      - prometheus --config.file=config/prometheus.local.yaml --web.listen-address=127.0.0.1:9090 --storage.tsdb.path=.local/prometheus
