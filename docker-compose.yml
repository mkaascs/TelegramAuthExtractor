services:
  redroid:
    image: redroid/redroid:13.0.0-latest
    container_name: redroid
    privileged: true
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
    volumes:
      - redroid-data:/data
      - /dev/binderfs:/dev/binderfs
    networks:
      - tg-net
    healthcheck:
      test: ["CMD", "/system/bin/sh", "-c", "[ \"$(getprop sys.boot_completed)\" = \"1\" ]"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  extractor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: extractor
    depends_on:
      redroid:
        condition: service_healthy
    environment:
      CONFIG_PATH: /config/redroid.yaml
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    ports:
      - "8080:8080"
    networks:
      - tg-net
    restart: unless-stopped

volumes:
  redroid-data:

networks:
  tg-net:
    driver: bridge