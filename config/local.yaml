env: "local" # prod, dev
http_server:
  port: 8080
  write_timeout: 5s
  read_timeout: 10s
service:
  session_ttl: 720h
  worker:
    code_wait: 2m
    cleanup_timeout: 30s
    queue_size: 50
adb:
  wait_timeout: 30s
  phone_check_timeout: 1m
  wait_interval: 0.8s
  package: "org.telegram.messenger.web"
  apk_url: "https://telegram.org/dl/android/apk"
  binary: "/Users/makaasz/Library/Android/sdk/platform-tools/adb"
  serial: "emulator-5554"
  needs_connect: false
postgres:
  addr: "localhost:5432"
  connection_timeout: 5s