openapi: 3.0.3

info:
  title: Telegram Auth Extractor API
  version: 1.0.0
  description: >
    Service for extracting Telegram authorization data (auth_key, dc_id,
    user_id) from a virtual Android. The service signs into the account via
    ADB; the confirmation code is submitted manually through a dedicated
    endpoint. The operation is asynchronous: the client creates a task, polls
    its status, and fetches the result once the task has finished.

servers:
  - url: /api/v1

security:
  - ApiKeyAuth: []

paths:
  /sessions:
    post:
      operationId: createSession
      summary: Create an extraction task
      description: >
        Starts the lifecycle: the service enters the phone number via ADB and
        reaches the code input screen. Returns the task in `pending` status
        immediately, without waiting for completion. If an unfinished task for
        the same phone number already exists, that task is returned instead of
        creating a new one (idempotent retry).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: >
            Idempotent retry — an unfinished task for this phone number already
            exists and is returned as is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionWithToken'
        '202':
          description: A new task was created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/me:
    get:
      operationId: getSession
      summary: Get task status
      security:
        - ApiKeyAuth: []
          SessionToken: []
      responses:
        '200':
          description: Current task state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteSession
      summary: Cancel the task and clean up the device
      security:
        - ApiKeyAuth: []
          SessionToken: []
      description: >
        Aborts an active task (including while waiting for the code) and
        returns the device to a clean state (pm clear). For already finished
        tasks it simply removes the record.
      responses:
        '204':
          description: Task cancelled/removed
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/me/code:
    post:
      operationId: submitCode
      summary: Submit the confirmation code
      security:
        - ApiKeyAuth: []
          SessionToken: []
      description: >
        Accepted only while the task is in `waiting_for_code` status. The code
        is entered into Telegram via ADB, after which the task continues its
        pipeline (extraction and verification).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCodeRequest'
      responses:
        '202':
          description: Code accepted, task continues processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Task is not waiting for a code (see current status in body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/me/result:
    get:
      operationId: getSessionResult
      summary: Fetch the extracted data
      security:
        - ApiKeyAuth: []
          SessionToken: []
      description: >
        Available only while the task is in `done` status. Otherwise returns
        409 with the current status in the body.
      responses:
        '200':
          description: Extracted authorization data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedData'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Result is not ready yet (see current status in body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Static API key shared with trusted clients
    SessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Per-session capability token issued on session creation. Scopes access
        to a single session; required alongside the API key on all operations
        that address a session by id

  responses:
    Unauthorized:
      description: API key is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: API key is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    SessionStatus:
      type: string
      description: Stage in the task lifecycle
      enum:
        - pending
        - queued
        - logging_in
        - waiting_for_code
        - entering_code
        - extracting
        - cleanup
        - done
        - failed

    CreateSessionRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          description: Phone number in E.164 format
          pattern: '^\+[1-9]\d{1,14}$'
          example: '+79991234567'

    SubmitCodeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Confirmation code from SMS/Telegram
          pattern: '^\d{5,6}$'
          example: '12345'

    Session:
      type: object
      required:
        - id
        - phone
        - status
        - created_at
        - code_attempts
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          example: '+79991234567'
        status:
          $ref: '#/components/schemas/SessionStatus'
        error:
          type: string
          nullable: true
          description: Reason for the `failed` transition; omitted otherwise
          example: code_timeout
        code_attempts:
          type: integer
        created_at:
          type: string
          format: date-time

    SessionWithToken:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required:
            - session_token
          properties:
            session_token:
              type: string
              description: >
                Per-session capability token (JWT). Required in the
                Authorization header for all operations on this session
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    SessionCreated:
      allOf:
        - $ref: '#/components/schemas/SessionWithToken'
        - type: object
          required:
            - decryption_key
          properties:
            decryption_key:
              type: string
              description: >
                Age private key (X25519) for decrypting the extracted auth_key.
                Returned only when a new session is created (202), never on an
                idempotent retry (200); the server does not store it
              example: AGE-SECRET-KEY-1QQPQ...

    ExtractedData:
      type: object
      required:
        - dc_id
        - auth_key
        - user_id
      properties:
        dc_id:
          type: integer
          description: Account home datacenter (resolved via USER_MIGRATE)
          example: 2
        auth_key:
          type: string
          description: >
            Extracted permanent auth key, encrypted to the session recipient and
            ASCII-armored (age). Decrypt with the decryption_key returned at
            session creation
          example: |
            -----BEGIN AGE ENCRYPTED FILE-----
            ...
            -----END AGE ENCRYPTED FILE-----
        user_id:
          type: integer
          format: int64
          example: 1153367122

    Error:
      type: object
      required:
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: session_not_waiting_for_code
        message:
          type: string
          example: 'session is not waiting for code (current: logging_in)'